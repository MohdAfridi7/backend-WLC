name: Deploy WLC Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy WLC Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          script: |

            cd /var/www/wlc/backend

            # Latest Code
            git fetch origin
            git reset --hard origin/main

            # Create .env
            echo "PORT=5052" > .env

            echo "MONGO_URL=${{ secrets.MONGO_URL }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

            echo "CLOUD_NAME=${{ secrets.CLOUD_NAME }}" >> .env
            echo "API_KEY=${{ secrets.API_KEY }}" >> .env
            echo "API_SECRET=${{ secrets.API_SECRET }}" >> .env

            echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
            echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> .env

            # Install Dependencies
            rm -rf node_modules package-lock.json
            npm install

            # Restart PM2
            pm2 delete wlc-backend || true
            PORT=5052 pm2 start server.js --name "wlc-backend"

            pm2 save